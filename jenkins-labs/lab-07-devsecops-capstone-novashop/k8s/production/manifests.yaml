apiVersion: apps/v1
kind: Deployment
metadata:
  name: novashop-order-service-production
  namespace: production
  labels:
    app: novashop-order-service
    env: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: novashop-order-service
      env: production
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: novashop-order-service
        env: production
    spec:
      containers:
      - name: order-service
        image: 127.0.0.1:18444/devops-public/novashop-order-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: APP_ENV
          value: "production"
        - name: PORT
          value: "8080"
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: novashop-order-service-production
  namespace: production
  labels:
    app: novashop-order-service
spec:
  type: NodePort
  selector:
    app: novashop-order-service
    env: production
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
    protocol: TCP
