# ==============================================================================
# NovaShop — Fluent Bit Çok Kaynaklı Log Toplayıcı Yapılandırması (ELK Stack)
# Kapsam: NovaShop Docker container'ları (forward), Kubernetes (Kind) novashop pod'ları, Ubuntu sistem logları
# Jenkins indeksi (novashop-jenkins-*) scripts/simulate-traffic.py ile üretilen örnek veridir.
# ==============================================================================

[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

# ------------------------------------------------------------------------------
# 1. GİRİŞLER (INPUTS): Docker, Kubernetes ve Ubuntu Sistem Logları
# ------------------------------------------------------------------------------

# 1.1. Docker Konteyner Logları (Fluentd Forward Protokolü :24224)
# Sunucudaki tüm container'lar okunmaz; yalnızca fluentd logging driver ile
# log gönderen NovaShop container'ları (docker-compose.logging-driver.yml) toplanır.
[INPUT]
    Name             forward
    Listen           0.0.0.0
    Port             24224
    Tag              docker.novashop.*

# 1.2. Kubernetes Pod Logları (Kind K8s Cluster, yalnızca novashop namespace'i)
# Kind worker'ları pod loglarını host'ta /var/log/novashop-kind/<node>/ altına yazar
# (deploy/k8s/kind-cluster-config.yaml extraMounts). Her pod dosyası bir kez okunur.
[INPUT]
    Name             tail
    Path             /var/log/novashop-kind/*/novashop_*/*/*.log
    Read_from_Head   On
    Tag              k8s.*
    DB               /tmp/flb_k8s.db
    Mem_Buf_Limit    5MB
    Skip_Long_Lines  On
    Refresh_Interval 5

# 1.3. Ubuntu Host Sistem Günlükleri (Syslog)
[INPUT]
    Name             tail
    Path             /var/log/syslog
    Tag              ubuntu.syslog
    DB               /tmp/flb_syslog.db
    Mem_Buf_Limit    5MB
    Skip_Long_Lines  On
    Refresh_Interval 5

# 1.4. Ubuntu Host Kimlik Doğrulama Günlükleri (Auth Log - SSH Girişleri vb.)
[INPUT]
    Name             tail
    Path             /var/log/auth.log
    Tag              ubuntu.auth
    DB               /tmp/flb_auth.db
    Mem_Buf_Limit    5MB
    Skip_Long_Lines  On
    Refresh_Interval 5

# ------------------------------------------------------------------------------
# 2. FİLTRELER (FILTERS): Parsing, Zenginleştirme ve Etiketleme
# ------------------------------------------------------------------------------

# Docker'un json-file sürücüsü ham satırı `log` alanına yazar. ECS uyumlu
# uygulamalar ise kendi JSON gövdelerinde `log` adında bir nesne kullanabilir.
# Bu iki biçimi aynı Elasticsearch indeksine doğrudan göndermek mapping
# conflict'e (string vs object) yol açar. Ham satırı her zaman `message`
# alanına taşıyoruz; böylece `log` alanı indeks şemasının parçası olmaz.
#
# Bilerek genel bir JSON parser kullanılmıyor: Bu input Elasticsearch, Kibana,
# Jenkins ve uygulama konteynerlerini birlikte dinler. Her uygulamanın serbest
# biçimli JSON'unu kök alana açmak, alan tiplerinin birbiriyle çakışmasına neden
# olur. Yapılandırılmış eğitim olayları simulate-traffic.py tarafından kendi
# kararlı şemasıyla doğrudan Elasticsearch'e gönderilir.
[FILTER]
    Name             modify
    Match            docker.*
    Rename           log message

[FILTER]
    Name             modify
    Match            k8s.*
    Rename           log message

[FILTER]
    Name             modify
    Match            novashop.*
    Rename           log message

# Docker Log Kaynak Etiketi
[FILTER]
    Name             record_modifier
    Match            docker.*
    Record           log_source docker_container

[FILTER]
    Name             record_modifier
    Match            novashop.*
    Record           log_source docker_container

# Kubernetes Log Kaynak Etiketi
[FILTER]
    Name             record_modifier
    Match            k8s.*
    Record           log_source kubernetes_pod

# Ubuntu Sistem Log Kaynak Etiketi
[FILTER]
    Name             record_modifier
    Match            ubuntu.*
    Record           log_source ubuntu_system

# ------------------------------------------------------------------------------
# 3. ÇIKIŞLAR (OUTPUTS): Elasticsearch 8.x İndeksleme
# ------------------------------------------------------------------------------

# 3.1. Docker Uygulama ve Konteyner Logları -> novashop-docker-*
[OUTPUT]
    Name             es
    Match            docker.*
    Host             elasticsearch
    Port             9200
    Index            novashop-docker
    Type             _doc
    Logstash_Format  On
    Logstash_Prefix  novashop-docker
    Suppress_Type_Name On
    Trace_Error      On

[OUTPUT]
    Name             es
    Match            novashop.*
    Host             elasticsearch
    Port             9200
    Index            novashop-docker
    Type             _doc
    Logstash_Format  On
    Logstash_Prefix  novashop-docker
    Suppress_Type_Name On
    Trace_Error      On

# 3.2. Kubernetes Pod Logları -> novashop-k8s-*
[OUTPUT]
    Name             es
    Match            k8s.*
    Host             elasticsearch
    Port             9200
    Index            novashop-k8s
    Type             _doc
    Logstash_Format  On
    Logstash_Prefix  novashop-k8s
    Suppress_Type_Name On
    Trace_Error      On

# 3.3. Ubuntu Sistem Logları -> novashop-ubuntu-*
[OUTPUT]
    Name             es
    Match            ubuntu.*
    Host             elasticsearch
    Port             9200
    Index            novashop-ubuntu
    Type             _doc
    Logstash_Format  On
    Logstash_Prefix  novashop-ubuntu
    Suppress_Type_Name On
    Trace_Error      On
