# ArgoCD Application: jenkins-labs reposundaki k8s/app klasörünü gitops-demo namespace'ine uygular.
# Image'ı pipeline (spec.source.kustomize.images) verir; sync de pipeline'dan başlatılır.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.com/devops-practitioner-labs/jenkins-labs.git
    targetRevision: main
    path: bonus-labs/06-argocd-gitops-sync/k8s/app
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
